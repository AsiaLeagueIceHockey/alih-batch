name: Update YouTube Highlights

on:
  schedule:
    - cron: '45 9,11,13 * * *'  # KST 18:45, 20:45, 22:45
  
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate matches without writing highlight URLs
        required: true
        default: true
        type: boolean
      allow_write:
        description: Update matched schedule highlight URLs
        required: true
        default: false
        type: boolean

jobs:
  scrape-highlights:
    runs-on: ubuntu-latest

    steps:
      # 1. 리포지토리 코드 체크아웃
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Python 3.10 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Python 의존성 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase yt-dlp

      # 4. 스크래핑 스크립트 실행
      - name: Run highlights scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TARGET_SEASON: '2026-27'
          DRY_RUN: ${{ inputs.dry_run }}
          ALLOW_WRITE: ${{ inputs.allow_write }}
        run: python scrape-highlights.py
