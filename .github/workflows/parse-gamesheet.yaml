name: Popup Game Sheet Scraper

on:
  # 12:00-23:40 KST only. The scraper itself limits writes to recent games.
  schedule:
    - cron: '*/20 3-14 * * *'
  
  workflow_dispatch:
    inputs:
      target_season:
        description: Explicit target season
        required: true
        default: '2026-27'
        type: string
      internal_game_nos:
        description: Comma-separated platform game numbers
        required: true
        default: '1'
        type: string
      dry_run:
        description: Parse without writing database rows
        required: true
        default: true
        type: boolean
      allow_write:
        description: Requires an approved identity-contract canary
        required: true
        default: false
        type: boolean
      identity_contract_verified:
        description: Set true only after migration 008 postflight has passed
        required: true
        default: false
        type: boolean

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Parse requested official game sheets
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            node ./scrapeSingleGame.js --game-nos="$INTERNAL_GAME_NOS"
          else
            node ./scrapeSingleGame.js
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          INTERNAL_GAME_NOS: ${{ inputs.internal_game_nos }}
          TARGET_SEASON: ${{ github.event_name == 'schedule' && '2026-27' || inputs.target_season }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          ALLOW_GAME_SHEET_WRITE: ${{ github.event_name == 'schedule' && 'true' || inputs.allow_write }}
          GAME_IDENTITY_CONTRACT_VERIFIED: ${{ github.event_name == 'schedule' && 'true' || inputs.identity_contract_verified }}
