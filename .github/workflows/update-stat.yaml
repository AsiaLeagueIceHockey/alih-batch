name: Update Player Stats

on:
#  schedule:
#    - cron: "0 * * * *"  # 매시간 실행 (UTC)
  workflow_dispatch:
    inputs:
      target_season:
        description: Explicit target season
        required: true
        default: '2026-27'
        type: string
      dry_run:
        description: Validate official personal rankings without writing rows
        required: true
        default: true
        type: boolean
      allow_write:
        description: Update official player ranking rows
        required: true
        default: false
        type: boolean

jobs:
  scrape-players:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 supabase

      - name: Run player stats scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }} # 쓰기 권한 필요
          TARGET_SEASON: ${{ inputs.target_season }}
          SOURCE_POPUP_ID: '49'
          DRY_RUN: ${{ inputs.dry_run }}
          ALLOW_WRITE: ${{ inputs.allow_write }}
        run: python scrape-stat.py

      - name: Run Players Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TARGET_SEASON: ${{ inputs.target_season }}
          SOURCE_POPUP_ID: '49'
          DRY_RUN: ${{ inputs.dry_run }}
          ALLOW_WRITE: ${{ inputs.allow_write }}
        run: python scrape-players.py
