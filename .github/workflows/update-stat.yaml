name: Update Player Stats

on:
  schedule:
    - cron: '30 9,11,13 * * *'  # KST 18:30, 20:30, 22:30
  workflow_dispatch:
    inputs:
      target_season:
        description: Explicit target season
        required: true
        default: '2026-27'
        type: string
      dry_run:
        description: Validate official personal rankings without writing rows
        required: true
        default: true
        type: boolean
      allow_write:
        description: Update official player ranking rows
        required: true
        default: false
        type: boolean
      run_individual_records:
        description: Run individual.html import only after all six official teams are present
        required: true
        default: false
        type: boolean

jobs:
  scrape-players:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 supabase

      - name: Run player stats scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }} # 쓰기 권한 필요
          TARGET_SEASON: ${{ github.event_name == 'schedule' && '2026-27' || inputs.target_season }}
          SOURCE_POPUP_ID: '49'
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          ALLOW_WRITE: ${{ github.event_name == 'schedule' && 'true' || inputs.allow_write }}
        run: python scrape-stat.py

      - name: Run Players Scraper
        if: ${{ inputs.run_individual_records }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TARGET_SEASON: ${{ inputs.target_season || '2026-27' }}
          SOURCE_POPUP_ID: '49'
          DRY_RUN: ${{ inputs.dry_run }}
          ALLOW_WRITE: ${{ inputs.allow_write }}
        run: python scrape-players.py
