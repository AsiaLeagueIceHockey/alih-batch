name: Update ALIH Standings

on:
  schedule:
    - cron: '15 9,11,13 * * *'  # KST 18:15, 20:15, 22:15
  
  workflow_dispatch:
    inputs:
      target_season:
        description: Explicit target season
        required: true
        default: '2026-27'
        type: string
      dry_run:
        description: Validate official standings without writing rows
        required: true
        default: true
        type: boolean
      allow_write:
        description: Update official active-team standings rows
        required: true
        default: false
        type: boolean

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # 1. 리포지토리 코드 체크아웃
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Python 3.10 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Python 의존성 설치 (requirements.txt 사용)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 supabase

      # 4. 스크래핑 스크립트 실행
      - name: Run scrape script
        env:
          # GitHub Secrets에 저장된 값을 환경 변수로 주입
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TARGET_SEASON: ${{ github.event_name == 'schedule' && '2026-27' || inputs.target_season }}
          SOURCE_POPUP_ID: '49'
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          ALLOW_WRITE: ${{ github.event_name == 'schedule' && 'true' || inputs.allow_write }}
        run: python scrape-standings.py
